    <!-- Animated opening screen, shown only inside the installed app (Android app or home-screen install).
         It starts exactly where the native splash image ends (same colour, same logo size and place),
         so the two read as one movement: the logo eases up and smaller, then the name and molars appear. -->
    <style>
      #boot{--u:min(1vw,4.8px);display:none;position:fixed;inset:0;z-index:2147483647;background:#eaf0fb;overflow:hidden;transition:opacity .45s ease,visibility .45s ease}
      html.is-app #boot{display:block}
      #boot.out{opacity:0;visibility:hidden}
      #boot .mark,#boot .name,#boot .molars,#boot .note{position:absolute;left:50%;top:50%}
      #boot .mark{width:calc(var(--u)*66.7);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:22%;animation:bootShrink .85s cubic-bezier(.55,0,.25,1) .4s both}
      #boot .mark img{width:100%;height:100%;display:block;border-radius:22%;animation:bootGlow .6s ease .9s both}
      #boot .mark::before{content:"";position:absolute;inset:-14%;border-radius:32%;border:2px solid rgba(37,99,235,.35);opacity:0;animation:bootRing 1.8s ease-out 1.1s infinite}
      #boot .mark::after{content:"";position:absolute;inset:0;border-radius:22%;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);background-size:250% 100%;background-position:160% 0;animation:bootShine 1s ease 1.2s 1 both;mix-blend-mode:soft-light}
      #boot .name{transform:translate(-50%,-50%) translateY(calc(var(--u)*8));font:800 calc(var(--u)*9)/1 "Bricolage Grotesque",system-ui,sans-serif;color:#2563eb;white-space:nowrap;animation:bootName .6s ease 1.05s both}
      #boot .molars{display:flex;gap:calc(var(--u)*5);transform:translate(-50%,-50%) translateY(calc(var(--u)*25));animation:bootName .5s ease 1.25s both}
      #boot.quick .molars{display:none}
      #boot .m{width:calc(var(--u)*13);height:auto;overflow:visible;transform-origin:50% 100%;animation:bootDance .7s ease-in-out 1.5s infinite}
      #boot .m2{animation-delay:1.85s;animation-direction:alternate-reverse}
      #boot .note{transform:translate(-50%,-50%) translateY(calc(var(--u)*42));width:90%;text-align:center;min-height:16px;font:500 calc(var(--u)*3.6)/1.3 Figtree,system-ui,sans-serif;color:#51659a;opacity:0;transition:opacity .4s}
      #boot .note.on{opacity:1}
      #boot .note.off{color:#b45309;font-weight:600}
      @keyframes bootShrink{from{transform:translate(-50%,-50%) scale(1)}to{transform:translate(-50%,-50%) translateY(calc(var(--u)*-22)) scale(.5)}}
      @keyframes bootGlow{from{box-shadow:0 0 0 rgba(30,58,138,0)}to{box-shadow:0 calc(var(--u)*4) calc(var(--u)*9) rgba(30,58,138,.28)}}
      @keyframes bootRing{0%{opacity:.7;transform:scale(.92)}100%{opacity:0;transform:scale(1.25)}}
      @keyframes bootShine{to{background-position:-60% 0}}
      @keyframes bootName{from{opacity:0;margin-top:calc(var(--u)*3)}to{opacity:1;margin-top:0}}
      @keyframes bootDance{0%{transform:translateY(0) rotate(-9deg)}25%{transform:translateY(calc(var(--u)*-3.2)) rotate(0)}50%{transform:translateY(0) rotate(9deg)}75%{transform:translateY(calc(var(--u)*-3.2)) rotate(0)}100%{transform:translateY(0) rotate(-9deg)}}
      @media (prefers-reduced-motion:reduce){#boot *,#boot *::before,#boot *::after{animation:none!important}#boot .mark{transform:translate(-50%,-50%) translateY(calc(var(--u)*-22)) scale(.5)}}
    </style>
    <script>
      (function () {
        try {
          var d = document.documentElement;
          var app = (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) ||
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
          var seen = false;
          try { seen = sessionStorage.getItem('merident-boot') === '1'; } catch (e) {}
          if (!app || seen) return;
          try { sessionStorage.setItem('merident-boot', '1'); } catch (e) {}
          d.className += ' is-app';
          var first = true;
          try { first = localStorage.getItem('merident-boot-seen') !== '1'; localStorage.setItem('merident-boot-seen', '1'); } catch (e) {}
          var min = first ? 2000 : 1300;
          var bt = document.getElementById('boot');
          if (bt && !first) bt.className += ' quick';
          var note = document.getElementById('boot-note');
          function say(msg, off) { if (note) { note.textContent = msg; note.className = 'note on' + (off ? ' off' : ''); } }
          if (window.navigator.onLine === false) say('You are offline. Opening your saved data.', true);
          var t0 = Date.now();
          function hide() {
            var b = document.getElementById('boot');
            if (b) { b.className += ' out'; setTimeout(function () { if (b.parentNode) b.parentNode.removeChild(b); d.className = d.className.replace(' is-app', ''); }, 600); }
          }
          function ready() {
            var r = document.getElementById('root');
            return r && r.firstChild && !r.querySelector('[data-loading]');
          }
          var iv = setInterval(function () {
            var spent = Date.now() - t0;
            if (spent > 4000 && window.navigator.onLine !== false) say('Slow connection, still loading your clinic…');
            if ((spent > min && ready()) || spent > 8000) { clearInterval(iv); hide(); }
          }, 150);
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="boot" aria-hidden="true">

      <div class="name">MeriDent</div>
      <div class="molars">
        <svg class="m m1" viewBox="0 0 60 70"><path d="M10 22c0-10 8-14 14-12 4 1 8 1 12 0 6-2 14 2 14 12 0 8-3 12-4 22-1 9-2 17-6 17-5 0-4-12-9-12s-4 12-9 12c-4 0-5-8-6-17-1-10-6-14-6-22z" fill="#fff" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/><circle cx="23" cy="30" r="2.6" fill="#2563eb"/><circle cx="38" cy="30" r="2.6" fill="#2563eb"/><path d="M25 38q6 6 12 0" fill="none" stroke="#2563eb" stroke-width="2.6" stroke-linecap="round"/><circle cx="17" cy="37" r="3" fill="#fca5a5" opacity=".7"/><circle cx="44" cy="37" r="3" fill="#fca5a5" opacity=".7"/></svg>
        <svg class="m m2" viewBox="0 0 60 70"><path d="M10 22c0-10 8-14 14-12 4 1 8 1 12 0 6-2 14 2 14 12 0 8-3 12-4 22-1 9-2 17-6 17-5 0-4-12-9-12s-4 12-9 12c-4 0-5-8-6-17-1-10-6-14-6-22z" fill="#fff" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/><circle cx="23" cy="30" r="2.6" fill="#2563eb"/><circle cx="38" cy="30" r="2.6" fill="#2563eb"/><path d="M25 37q6 8 12 0z" fill="#2563eb"/><circle cx="17" cy="37" r="3" fill="#fca5a5" opacity=".7"/><circle cx="44" cy="37" r="3" fill="#fca5a5" opacity=".7"/></svg>
