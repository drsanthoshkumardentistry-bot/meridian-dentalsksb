name: Firestore rules

on:
  push:
    paths:
      - "firestore.rules"
      - "rules-tests/**"
      - "firebase.json"
      - "vitest.rules.config.mjs"
      - ".github/workflows/rules.yml"
      - "package-lock.json"
  pull_request:
    paths:
      - "firestore.rules"
      - "rules-tests/**"
      - "firebase.json"
      - "vitest.rules.config.mjs"
      - ".github/workflows/rules.yml"
      - "package-lock.json"

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Run rules against the Firestore emulator
        run: npx --yes firebase-tools@13.35.1 emulators:exec --only firestore --project demo-merident "npx vitest run --config vitest.rules.config.mjs"
