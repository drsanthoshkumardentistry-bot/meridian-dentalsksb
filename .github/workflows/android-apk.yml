name: Android APK

# Builds an installable MeriDent app (APK) you can download from the run page.
# Start it from GitHub: Actions, Android APK, Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [android-app]

permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MeriDent-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish download link (GitHub Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk MeriDent.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest MeriDent.apk --target "$GITHUB_SHA" --title "MeriDent Android app" --notes "Latest MeriDent Android APK. Download MeriDent.apk and install it."
