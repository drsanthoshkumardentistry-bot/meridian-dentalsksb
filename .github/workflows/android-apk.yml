name: Android APK

# Builds an installable MeriDent app (APK) you can download from the run page.
# Start it from GitHub: Actions, Android APK, Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [android-app]

permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Prepare the signing key (kept in GitHub secrets, never in the repository)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "Add the ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets first."; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Build the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: MeriDent-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish download link (GitHub Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk MeriDent.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest MeriDent.apk --target "$GITHUB_SHA" --title "MeriDent Android app" --notes "Latest MeriDent Android APK. Download MeriDent.apk and install it."
