name: Daily backup

# Every day 2:00 AM IST: copies the whole database, encrypts it with backup-public.pem (only the owner's offline
# private key can open it) and keeps the encrypted file for 90 days as a downloadable artifact.
# Needs the repository secret FIREBASE_SERVICE_ACCOUNT. If the backup fails, GitHub emails the repository owner.
on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the secret exists
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::Repository secret FIREBASE_SERVICE_ACCOUNT is not set."; exit 1; fi
      - name: Back up and encrypt
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/backup.mjs backup.enc
      - name: Keep the encrypted file
        uses: actions/upload-artifact@v4
        with:
          name: merident-backup-${{ github.run_id }}
          path: backup.enc
          retention-days: 90
          if-no-files-found: error
