name: Browser smoke test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm i --no-save playwright@1.49.1 wait-on@8
      - run: npx playwright install --with-deps chromium
      - name: Serve the build and run the smoke test
        run: |
          npx vite preview --port 4173 &
          npx wait-on http://localhost:4173 --timeout 60000
          node e2e/smoke.cjs
